<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArgoQuote Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --gray: #64748b;
            --light: #f8fafc;
            --border: #e2e8f0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
        }
        
        .app-container {
            display: grid;
            grid-template-columns: 420px 1fr;
            min-height: 100vh;
        }
        
        .input-panel {
            padding: 24px;
            background: white;
            overflow-y: auto;
            max-height: 100vh;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }
        
        .logo-text { font-size: 20px; font-weight: 700; color: var(--dark); }
        
        h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--dark); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .input-group { margin-bottom: 16px; }
        
        label { display: block; font-size: 13px; font-weight: 500; color: var(--gray); margin-bottom: 6px; }
        
        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* Category Tabs */
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }
        
        .category-tab {
            padding: 8px 12px;
            background: var(--light);
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .category-tab:hover { border-color: var(--primary); }
        
        .category-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* Photo Upload */
        .photo-upload-zone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--light);
            margin-bottom: 16px;
        }
        
        .photo-upload-zone:hover {
            border-color: var(--primary);
            background: #eff6ff;
        }
        
        #photoInput { display: none; }
        
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        
        .photo-preview {
            position: relative;
            aspect-ratio: 1;
            border-radius: 6px;
            overflow: hidden;
            background: var(--light);
        }
        
        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .photo-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
        }
        
        /* Scope Builder */
        .scope-builder {
            background: var(--light);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
        }
        
        .scope-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: white;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid var(--border);
        }
        
        .scope-item:last-child { margin-bottom: 0; }
        
        .scope-label { font-size: 13px; }
        
        .scope-input {
            width: 80px;
            padding: 6px 8px;
            text-align: right;
            font-size: 13px;
        }
        
        .scope-qty {
            width: 50px;
            padding: 6px 8px;
            text-align: center;
            font-size: 13px;
            margin-right: 8px;
        }
        
        .scope-unit {
            font-size: 11px;
            color: var(--gray);
            margin-right: 8px;
        }
        
        /* Rate Editor */
        .rates-section {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
        }
        
        .rates-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .rates-header h3 { font-size: 13px; color: #92400e; }
        
        .rates-content { display: none; }
        .rates-content.open { display: block; }
        
        .rate-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #fcd34d;
            font-size: 12px;
        }
        
        .rate-row:last-child { border-bottom: none; }
        .rate-label { color: #78350f; }
        
        .rate-input {
            width: 70px;
            padding: 4px 8px;
            font-size: 12px;
            text-align: right;
        }
        
        /* Quote Panel */
        .quote-panel {
            padding: 32px;
            background: #0f172a;
            color: white;
            overflow-y: auto;
            max-height: 100vh;
        }
        
        .quote-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .quote-title { font-size: 24px; font-weight: 700; }
        .quote-date { color: var(--gray); font-size: 13px; }
        .quote-badge {
            background: var(--success);
            color: white;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .quote-photos {
            margin-bottom: 20px;
        }
        
        .quote-photos h4 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray);
            margin-bottom: 8px;
        }
        
        .quote-photo-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }
        
        .quote-photo-grid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
        }
        
        .line-items { margin-bottom: 24px; }
        
        .line-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .item-category {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray);
            margin-bottom: 2px;
        }
        
        .item-name { font-size: 13px; color: rgba(255,255,255,0.8); }
        .item-price { font-size: 14px; font-weight: 600; }
        
        .totals {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 24px;
        }
        
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
        }
        
        .total-row.grand {
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 8px;
            padding-top: 12px;
            font-size: 18px;
            font-weight: 700;
            color: var(--success);
        }
        
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .action-btn {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .action-btn.primary { background: var(--success); color: white; border: none; }
        .action-btn.secondary { background: transparent; color: white; border: 2px solid rgba(255,255,255,0.2); }
        
        .generating {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .generating.active { display: block; }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }
        
        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Input Panel -->
        <div class="input-panel">
            <div class="logo">
                <div class="logo-icon">AQ</div>
                <div class="logo-text">ArgoQuote Pro</div>
            </div>
            
            <!-- Category Tabs -->
            <div class="category-tabs" id="categoryTabs">
                <div class="category-tab active" data-cat="kitchen">Kitchen</div>
                <div class="category-tab" data-cat="bathroom">Bathroom</div>
                <div class="category-tab" data-cat="adu">ADU</div>
                <div class="category-tab" data-cat="remodel">Remodel</div>
                <div class="category-tab" data-cat="newbuild">New Build</div>
            </div>
            
            <!-- Photo Upload -->
            <div class="photo-upload-zone" id="uploadZone">
                <div style="font-size:24px;margin-bottom:8px;">📷</div>
                <div style="font-size:12px;color:var(--gray);">Click or drag photos</div>
            </div>
            <input type="file" id="photoInput" multiple accept="image/*">
            <div class="photo-grid" id="photoGrid"></div>
            
            <!-- Project Details -->
            <div class="input-group">
                <label>Project Name</label>
                <input type="text" id="projectName" placeholder="e.g., Smith Kitchen Remodel">
            </div>
            
            <!-- Scope Builder -->
            <div class="scope-builder" id="scopeBuilder">
                <!-- Populated by JavaScript based on category -->
            </div>
            
            <!-- Additional Notes -->
            <div class="input-group">
                <label>Additional Details</label>
                <textarea id="notes" rows="2" placeholder="Any additional details..."></textarea>
            </div>
            
            <!-- Rates Editor -->
            <div class="rates-section">
                <div class="rates-header" onclick="toggleRates()">
                    <h3>⚙️ Edit Rates (Bay Area 2026)</h3>
                    <span>▼</span>
                </div>
                <div class="rates-content" id="ratesContent"></div>
            </div>
            
            <div class="input-group">
                <label>Markup %</label>
                <input type="number" id="markup" value="25" min="0" max="100">
            </div>
            
            <button class="action-btn primary" style="width:100%;padding:14px;" onclick="generateQuote()">
                ⚡ Generate Quote
            </button>
        </div>
        
        <!-- Quote Panel -->
        <div class="quote-panel">
            <div class="quote-header">
                <div>
                    <div class="quote-title">Quote</div>
                    <div class="quote-date" id="quoteDate"></div>
                </div>
                <div class="quote-badge" id="quoteBadge">DRAFT</div>
            </div>
            
            <div class="empty-state" id="emptyState">
                <div style="font-size:40px;margin-bottom:12px;">📋</div>
                <p>Select category, add scope items, click Generate</p>
            </div>
            
            <div class="generating" id="generating">
                <div class="spinner"></div>
                <p>Generating quote...</p>
            </div>
            
            <div id="quoteContent" style="display:none;">
                <div class="quote-photos" id="quotePhotos"></div>
                <div class="line-items" id="lineItems"></div>
                <div class="totals" id="totals"></div>
                <div class="actions">
                    <button class="action-btn primary" onclick="saveQuote()">💾 Save PDF</button>
                    <button class="action-btn secondary" onclick="newQuote()">➕ New Quote</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // State
        let photos = [];
        let currentCategory = 'kitchen';
        
        // Bay Area 2026 Rates
        const ratesDB = {
            kitchen: {
                'Cabinetry (custom)': { rate: 800, unit: 'lf', desc: 'Custom cabinets' },
                'Cabinetry (RTA)': { rate: 300, unit: 'lf', desc: 'Ready-to-assemble' },
                'Countertops (quartz)': { rate: 85, unit: 'sqft', desc: 'Quartz slabs' },
                'Countertops (granite)': { rate: 75, unit: 'sqft', desc: 'Granite' },
                'Backsplash (tile)': { rate: 35, unit: 'sqft', desc: 'Tile installation' },
                'Backsplash (mosaic)': { rate: 50, unit: 'sqft', desc: 'Mosaic/glass' },
                'Appliances': { rate: 8000, unit: 'unit', desc: 'Mid-range package' },
                'Plumbing (fixture)': { rate: 500, unit: 'ea', desc: 'Sink, faucet install' },
                'Electrical': { rate: 2500, unit: 'job', desc: 'Outlets, lighting' },
                'Flooring': { rate: 12, unit: 'sqft', desc: 'Hardwood/luxury vinyl' },
                'Painting': { rate: 4, unit: 'sqft', desc: 'Walls + trim' },
                'Permits': { rate: 0.03, unit: 'percent', desc: '% of construction' }
            },
            bathroom: {
                ' Vanity': { rate: 1200, unit: 'ea', desc: 'Vanity + mirror' },
                'Countertop': { rate: 2500, unit: 'unit', desc: 'Stone top + install' },
                'Toilet': { rate: 650, unit: 'ea', desc: 'New toilet install' },
                'Shower/tub': { rate: 4500, unit: 'ea', desc: 'Tile/glass enclosure' },
                'Tile (floor)': { rate: 18, unit: 'sqft', desc: 'Floor tile install' },
                'Tile (walls)': { rate: 22, unit: 'sqft', desc: 'Wall tile install' },
                'Plumbing': { rate: 2000, unit: 'job', desc: 'Relocation/repipe' },
                'Electrical': { rate: 1200, unit: 'job', desc: 'Lights, fan, outlets' },
                'Ventilation': { rate: 800, unit: 'ea', desc: 'Exhaust fan' },
                'Painting': { rate: 4, unit: 'sqft', desc: 'Walls + ceiling' },
                'Permits': { rate: 0.03, unit: 'percent', desc: '% of construction' }
            },
            adu: {
                'New Construction': { rate: 300, unit: 'sqft', desc: 'Stick-built' },
                'Prefab ADU': { rate: 200, unit: 'sqft', desc: 'Prefabricated' },
                'Garage Conversion': { rate: 175, unit: 'sqft', desc: 'Convert existing' },
                'Electrical': { rate: 20, unit: 'sqft', desc: 'Full electrical' },
                'Plumbing': { rate: 18, unit: 'sqft', desc: 'Full plumbing' },
                'HVAC': { rate: 12, unit: 'sqft', desc: 'Heat/AC' },
                'Insulation': { rate: 4, unit: 'sqft', desc: 'Full insulation' },
                'Drywall': { rate: 8, unit: 'sqft', desc: 'Finish walls' },
                'Flooring': { rate: 12, unit: 'sqft', desc: 'Hardwood/tile' },
                'Kitchen': { rate: 15000, unit: 'unit', desc: 'Full kitchen install' },
                'Bathroom': { rate: 12000, unit: 'unit', desc: 'Full bath install' },
                'Permits': { rate: 0.04, unit: 'percent', desc: '% of construction' },
                'Impact Fees': { rate: 15000, unit: 'unit', desc: 'City impact fees' }
            },
            remodel: {
                'Full Demolition': { rate: 8, unit: 'sqft', desc: 'Strip to studs' },
                'Framing': { rate: 12, unit: 'sqft', desc: 'Structural changes' },
                'Electrical': { rate: 15, unit: 'sqft', desc: 'Rewire' },
                'Plumbing': { rate: 12, unit: 'sqft', desc: 'Repipe' },
                'HVAC': { rate: 10, unit: 'sqft', desc: 'New ducting' },
                'Insulation': { rate: 4, unit: 'sqft', desc: 'R-30+ insulation' },
                'Drywall': { rate: 8, unit: 'sqft', desc: 'Hang + finish' },
                'Flooring': { rate: 12, unit: 'sqft', desc: 'Hardwood/tile/LVP' },
                'Paint (interior)': { rate: 4, unit: 'sqft', desc: 'Walls + trim' },
                'Kitchen': { rate: 40000, unit: 'unit', desc: 'Mid-range kitchen' },
                'Bathroom': { rate: 15000, unit: 'unit', desc: 'Full bath' },
                'Windows': { rate: 800, unit: 'ea', desc: 'New windows' },
                'Doors': { rate: 600, unit: 'ea', desc: 'Interior + exterior' },
                'Permits': { rate: 0.03, unit: 'percent', desc: '% of construction' }
            },
            newbuild: {
                'Foundation': { rate: 35, unit: 'sqft', desc: 'Concrete slab' },
                'Framing': { rate: 45, unit: 'sqft', desc: 'Wood frame' },
                'Roofing': { rate: 12, unit: 'sqft', desc: 'Composition shingles' },
                'Electrical': { rate: 18, unit: 'sqft', desc: 'Full wire + panel' },
                'Plumbing': { rate: 15, unit: 'sqft', desc: 'Full rough + finish' },
                'HVAC': { rate: 10, unit: 'sqft', desc: 'Central AC/heat' },
                'Insulation': { rate: 4, unit: 'sqft', desc: 'Full house' },
                'Drywall': { rate: 8, unit: 'sqft', desc: 'Hang + finish' },
                'Exterior Siding': { rate: 12, unit: 'sqft', desc: 'Stucco/siding' },
                'Paint (exterior)': { rate: 3, unit: 'sqft', desc: 'Full exterior' },
                'Paint (interior)': { rate: 4, unit: 'sqft', desc: 'Walls + trim' },
                'Flooring': { rate: 12, unit: 'sqft', desc: 'Hardwood/tile' },
                'Kitchen': { rate: 50000, unit: 'unit', desc: 'Full kitchen' },
                'Bathrooms': { rate: 25000, unit: 'unit', desc: '2 bath home' },
                'Garage': { rate: 45, unit: 'sqft', desc: 'Attached garage' },
                'Landscaping': { rate: 8, unit: 'sqft', desc: 'Basic landscaping' },
                'Permits': { rate: 0.04, unit: 'percent', desc: '% of construction' },
                'Impact Fees 25000,': { rate: unit: 'unit', desc: 'City fees' }
            }
        };
        
        // Set date
        document.getElementById('quoteDate').textContent = new Date().toLocaleDateString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
        
        // Category tabs
        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.cat;
                renderScopeBuilder();
            });
        });
        
        // Photo upload
        const uploadZone = document.getElementById('uploadZone');
        const photoInput = document.getElementById('photoInput');
        
        uploadZone.addEventListener('click', () => photoInput.click());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.style.borderColor = 'var(--primary)'; });
        uploadZone.addEventListener('dragleave', () => { uploadZone.style.borderColor = 'var(--border)'; });
        uploadZone.addEventListener('drop', (e) => { e.preventDefault(); uploadZone.style.borderColor = 'var(--border)'; handleFiles(e.dataTransfer.files); });
        photoInput.addEventListener('change', (e) => handleFiles(e.target.files));
        
        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    photos.push({ name: file.name, data: e.target.result });
                    renderPhotos();
                };
                reader.readAsDataURL(file);
            });
        }
        
        function renderPhotos() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = photos.map((p, i) => `
                <div class="photo-preview">
                    <img src="${p.data}" alt="Site photo">
                    <button class="photo-remove" onclick="photos.splice(${i},1);renderPhotos()">×</button>
                </div>
            `).join('');
        }
        
        function renderScopeBuilder() {
            const builder = document.getElementById('scopeBuilder');
            const items = ratesDB[currentCategory];
            
            builder.innerHTML = Object.entries(items).map(([name, data]) => `
                <div class="scope-item">
                    <span class="scope-label">${name}</span>
                    <div style="display:flex;align-items:center;">
                        <input type="number" class="scope-qty" data-item="${name}" value="${getDefaultQty(name)}" min="0">
                        <span class="scope-unit">${data.unit}</span>
                        <input type="number" class="scope-input" data-rate="${name}" value="${data.rate}" step="${data.rate < 1 ? 0.01 : 1}">
                    </div>
                </div>
            `).join('');
            
            renderRatesEditor();
        }
        
        function getDefaultQty(name) {
            const defaults = {
                'Cabinetry (custom)': 20,
                'Cabinetry (RTA)': 20,
                'Countertops (quartz)': 40,
                'Countertops (granite)': 40,
                'Backsplash (tile)': 40,
                'Backsplash (mosaic)': 30,
                'Vanity': 1,
                'Toilet': 1,
                'Shower/tub': 1,
                'Tile (floor)': 30,
                'Tile (walls)': 80,
                'New Construction': 1000,
                'Prefab ADU': 600,
                'Garage Conversion': 500,
                'Kitchen': 1,
                'Bathroom': 1,
                'Bathrooms': 2,
                'Electrical': 2000,
                'Plumbing': 1500,
                'HVAC': 1500,
                'Framing': 2000,
                'Full Demolition': 2000,
                'Flooring': 2000,
                'Paint (interior)': 2500,
                'Paint (exterior)': 3000,
                'Windows': 8,
                'Doors': 6,
                'Foundation': 2000,
                'Roofing': 2500,
                'Insulation': 2000,
                'Drywall': 2500,
                'Exterior Siding': 2500,
                'Garage': 400,
                'Landscaping': 2000,
                'Permits': 1,
                'Impact Fees': 1,
                'Appliances': 1,
                'Plumbing (fixture)': 1,
                'Backsplash': 40,
                'Ventilation': 1
            };
            return defaults[name] || 1;
        }
        
        function renderRatesEditor() {
            const container = document.getElementById('ratesContent');
            const items = ratesDB[currentCategory];
            
            container.innerHTML = Object.entries(items).map(([name, data]) => `
                <div class="rate-row">
                    <span class="rate-label">${name}</span>
                    <input type="number" class="rate-input" data-edit-rate="${name}" value="${data.rate}" step="${data.rate < 1 ? 0.01 : 1}">
                </div>
            `).join('');
            
            // Update scope inputs when rates change
            container.querySelectorAll('input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const name = e.target.dataset.editRate;
                    const newRate = parseFloat(e.target.value);
                    document.querySelector(`[data-rate="${name}"]`).value = newRate;
                });
            });
        }
        
        function toggleRates() {
            document.getElementById('ratesContent').classList.toggle('open');
        }
        
        function generateQuote() {
            const projectName = document.getElementById('projectName').value || 'Unnamed Project';
            const markup = parseFloat(document.getElementById('markup').value) || 25;
            
            // Collect scope items
            const items = [];
            document.querySelectorAll('.scope-item').forEach(item => {
                const qtyInput = item.querySelector('.scope-qty');
                const rateInput = item.querySelector('.scope-input');
                const name = qtyInput.dataset.item;
                const qty = parseFloat(qtyInput.value) || 0;
                const rate = parseFloat(rateInput.value) || 0;
                
                if (qty > 0) {
                    items.push({ name, qty, rate, category: currentCategory });
                }
            });
            
            if (items.length === 0 && photos.length === 0) {
                alert('Add scope items or photos');
                return;
            }
            
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('generating').classList.add('active');
            document.getElementById('quoteContent').style.display = 'none';
            
            setTimeout(() => {
                // Photos
                const quotePhotos = document.getElementById('quotePhotos');
                const badge = document.getElementById('quoteBadge');
                
                if (photos.length > 0) {
                    quotePhotos.innerHTML = `
                        <h4>📷 Site Photos (${photos.length})</h4>
                        <div class="quote-photo-grid">
                            ${photos.map(p => `<img src="${p.data}" alt="Site photo">`).join('')}
                        </div>
                    `;
                    badge.textContent = 'WITH PHOTOS';
                } else {
                    quotePhotos.innerHTML = '';
                    badge.textContent = 'DRAFT';
                }
                
                // Calculate totals
                let subtotal = 0;
                const lineItemsHtml = items.map(item => {
                    const cost = item.rate * item.qty;
                    subtotal += cost;
                    return `
                        <div class="line-item">
                            <div>
                                <div class="item-category">${item.category}</div>
                                <div class="item-name">${item.name} (${item.qty} ${ratesDB[item.category][item.name].unit})</div>
                            </div>
                            <div class="item-price">$${cost.toLocaleString()}</div>
                        </div>
                    `;
                }).join('');
                
                const overhead = subtotal * 0.15;
                const profit = subtotal * (markup / 100);
                const total = subtotal + overhead + profit;
                
                document.getElementById('lineItems').innerHTML = lineItemsHtml;
                document.getElementById('totals').innerHTML = `
                    <div class="total-row"><span>Subtotal</span><span>$${subtotal.toLocaleString()}</span></div>
                    <div class="total-row"><span>Overhead (15%)</span><span>$${overhead.toLocaleString()}</span></div>
                    <div class="total-row"><span>Markup (${markup}%)</span><span>$${profit.toLocaleString()}</span></div>
                    <div class="total-row grand"><span>TOTAL</span><span>$${total.toLocaleString()}</span></div>
                `;
                
                document.getElementById('generating').classList.remove('active');
                document.getElementById('quoteContent').style.display = 'block';
                
            }, 800);
        }
        
        function saveQuote() {
            alert('Use Ctrl+P / Cmd+P to print to PDF!');
        }
        
        function newQuote() {
            photos = [];
            document.getElementById('projectName').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('markup').value = '25';
            renderPhotos();
            renderScopeBuilder();
            document.getElementById('quoteContent').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        }
        
        // Initialize
        renderScopeBuilder();
    </script>
</body>
</html>
